name: Deploy to GitHub Pages

# 運用負荷ゼロが要件（要件定義書 D-4）なので、main に入ったものが
# そのまま GitHub Pages に出る形にする。サーバも DB も持たない。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避ける。進行中のものはキャンセルしない（公開物を壊さないため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # プロジェクトサイトは https://<user>.github.io/<repo>/ に配信されるため、
          # base にリポジトリ名が必要。名前を直書きせずここで解決する。
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
